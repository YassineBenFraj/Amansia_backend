spring.application.name=amansia-backend
server.port=8090

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/amansia_stage?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Google
app.google.client-id=${GOOGLE_CLIENT_ID:}

# JWT - replace this value in each deployed environment
jwt.secret=amansia-development-secret-key-must-be-at-least-32-bytes-long
jwt.expiration=86400000

# Stripe keys
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.currency=${STRIPE_CURRENCY:eur}
# Conversion du total affiche en TND vers le montant debite par Stripe en EUR.
stripe.tnd-to-eur-rate=${STRIPE_TND_TO_EUR_RATE:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:4200/paiement/succes?session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:4200/paiement/annule}

spring.jpa.open-in-view=false

# Product image storage
app.upload.dir=uploads/produits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# Tarif fixe serveur, dans la devise de paiement. Gratuit par defaut, configurable.
app.livraison.frais-fixes=${AMANSIA_FRAIS_LIVRAISON:0.00}

# Password reset emails. Supply SMTP credentials through environment variables.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.password-reset.cooldown-minutes=${PASSWORD_RESET_COOLDOWN_MINUTES:2}
